# Mycelium run configuration for the llama2.c example.
# Flat `key: value` lines and simple `- item` lists only; keys are snake_case.

# The run. Onboarding confirms or changes it.
run_id: llama2c_speed

# Score: speedup over the baseline (baseline time / candidate time). Higher is better.
direction: higher

# Measured during onboarding with `scripts/onboard.sh noise 5` on the machines
# that will run the search. 0 means "not measured yet". The noise of a speedup
# grows with the speedup, so the threshold is relative (0.05 = 5%).
noise_threshold: 0
noise_mode: relative

eval_budget_seconds: 60
eval_timeout_seconds: 180
# evaluate.sh runs score.sh this many times and records the median.
eval_repeats: 3

# score.sh draws fresh random prompts every evaluation, so the seed is only recorded.
seed: 0
data_version: stories15M

# Claims expire after 15 minutes without renewal.
claim_timeout_seconds: 900

strategy_every: 15

max_experiments_per_agent: ""
max_hours: ""
# A headless agent iteration is killed after this long.
iteration_timeout_seconds: 3600
# Before every verify_every-th iteration, launch.sh verifies the best other
# agent's node that is unverified (among the top verify_top, plus root).
verify_every: 1
verify_top: 5

# The candidate never uses these (score.sh takes the tokenizer from task/baseline/),
# but changing them is never a legitimate optimisation.
protected_paths:
  - "tokenizer.bin"
  - "tokenizer.model"

# Build outputs of `make run`; never recorded in nodes.
ignore_paths:
  - "run"
  - "runq"

target_upstream: "https://github.com/karpathy/llama2.c"
target_fork: ""
target_baseline: "350e04fe35433e6d2941dce5a1f53308f87058eb"
